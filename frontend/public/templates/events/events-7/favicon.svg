<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E92B2B" />
      <stop offset="100%" stop-color="#FF6B2C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#090A0D" stroke="#FF6B2C" stroke-width="2" />
  
  <!-- Marathon Flame -->
  <path d="M 50 15 C 55 28, 68 35, 68 52 C 68 68, 56 78, 50 78 C 44 78, 32 68, 32 52 C 32 35, 45 28, 50 15 Z" fill="url(#fireGrad)" filter="url(#glow)" />
  
  <!-- Inner Flame Spark -->
  <path d="M 50 32 C 53 40, 60 45, 60 55 C 60 63, 54 68, 50 68 C 46 68, 40 63, 40 55 C 40 45, 47 40, 50 32 Z" fill="#F8F7F2" opacity="0.9" />

  <!-- Runner Legs Motion Graphic -->
  <path d="M 42 70 L 48 58 L 56 64 L 62 76" stroke="#F8F7F2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>