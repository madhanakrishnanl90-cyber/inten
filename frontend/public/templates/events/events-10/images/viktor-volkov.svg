<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  <defs>
    <linearGradient id="bgV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051525"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Photorealistic Skin Gradients -->
    <radialGradient id="skinBaseV" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#f2caa7"/>
      <stop offset="60%" stop-color="#d99f79"/>
      <stop offset="100%" stop-color="#ab724e"/>
    </radialGradient>
    <linearGradient id="skinHighlightV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce3cc"/>
      <stop offset="100%" stop-color="#d99f79"/>
    </linearGradient>

    <linearGradient id="jerseyV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0033aa"/>
    </linearGradient>
  </defs>

  <rect width="500" height="650" fill="url(#bgV)"/>
  <circle cx="250" cy="200" r="240" fill="#00e5ff" opacity="0.15"/>

  <!-- Towering Shoulders & Jersey -->
  <path d="M 75 365 L 185 285 L 315 285 L 425 365 L 385 650 L 115 650 Z" fill="url(#jerseyV)"/>
  <path d="M 185 285 Q 250 320 315 285" fill="none" stroke="#ffffff" stroke-width="8"/>
  <text x="250" y="445" font-family="'Bebas Neue', sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">33</text>
  <text x="250" y="340" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="800" fill="#ff7518" text-anchor="middle" letter-spacing="3">TITANS</text>

  <!-- Neck -->
  <path d="M 212 245 L 212 305 Q 250 320 288 305 L 288 245 Z" fill="url(#skinHighlightV)"/>
  <path d="M 212 245 Q 250 275 288 245 L 288 270 Q 250 290 212 270 Z" fill="#ab724e" opacity="0.35"/>

  <!-- Human Head Base Oval -->
  <path d="M 165 180 C 165 95, 335 95, 335 180 C 335 255, 295 275, 250 275 C 205 275, 165 255, 165 180 Z" fill="url(#skinBaseV)"/>

  <!-- Facial Cheekbone Highlights -->
  <path d="M 175 175 C 185 135, 225 135, 250 140 C 275 135, 315 135, 325 175 C 315 215, 285 245, 250 250 C 215 245, 185 215, 175 175 Z" fill="url(#skinHighlightV)" opacity="0.65"/>

  <!-- Short Blonde/Light Hair Crop -->
  <path d="M 160 165 C 160 85, 340 85, 340 165 C 320 100, 180 100, 160 165 Z" fill="#d1a660"/>
  <path d="M 170 155 Q 210 140 250 142 Q 290 140 330 155 Q 310 120 250 118 Q 190 120 170 155 Z" fill="#e6c485"/>

  <!-- Human Ears -->
  <path d="M 158 170 C 148 180, 151 210, 168 210 Z" fill="url(#skinBaseV)"/>
  <path d="M 342 170 C 352 180, 349 210, 332 210 Z" fill="url(#skinBaseV)"/>

  <!-- Human Eyebrows -->
  <path d="M 190 162 Q 215 154 235 160" stroke="#a37637" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 265 160 Q 285 154 310 162" stroke="#a37637" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Realistic Blue Human Eyes -->
  <ellipse cx="215" cy="174" rx="14" ry="8" fill="#ffffff"/>
  <circle cx="215" cy="174" r="7" fill="#296b9c"/>
  <circle cx="215" cy="174" r="3" fill="#000000"/>
  <circle cx="217" cy="172" r="1.5" fill="#ffffff"/>

  <ellipse cx="285" cy="174" rx="14" ry="8" fill="#ffffff"/>
  <circle cx="285" cy="174" r="7" fill="#296b9c"/>
  <circle cx="285" cy="174" r="3" fill="#000000"/>
  <circle cx="287" cy="172" r="1.5" fill="#ffffff"/>

  <!-- Human Nose -->
  <path d="M 242 204 C 235 206, 235 214, 245 214 C 255 214, 265 206, 258 204 Q 250 216 242 204 Z" fill="#ab724e"/>

  <!-- Human Lips -->
  <path d="M 225 234 Q 250 228 275 234 Q 250 240 225 234 Z" fill="#c47d6c"/>

  <!-- Nameplate -->
  <rect x="0" y="570" width="500" height="80" fill="#050505" opacity="0.95"/>
  <text x="250" y="612" font-family="'Bebas Neue', sans-serif" font-size="36" font-weight="900" fill="#00e5ff" text-anchor="middle" letter-spacing="3">VIKTOR VOLKOV #33</text>
  <text x="250" y="638" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">CENTER — CITY TITANS</text>
</svg>
