<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgDunk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#330a00"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ballDunk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7518"/>
      <stop offset="100%" stop-color="#ff4d00"/>
    </linearGradient>
    <radialGradient id="rimGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgDunk)"/>

  <!-- Speed Lines & Dynamic Explosion Particles -->
  <line x1="100" y1="450" x2="600" y2="50" stroke="#ff4d00" stroke-width="4" opacity="0.4"/>
  <line x1="50" y1="350" x2="650" y2="50" stroke="#ff7518" stroke-width="2" opacity="0.3"/>
  <line x1="200" y1="480" x2="700" y2="100" stroke="#ff4d00" stroke-width="3" opacity="0.3"/>

  <!-- Basketball Hoop & Backboard -->
  <rect x="580" y="40" width="160" height="120" rx="4" fill="none" stroke="#ffffff" stroke-width="6"/>
  <rect x="620" y="80" width="80" height="60" fill="none" stroke="#ff4d00" stroke-width="4"/>
  <rect x="640" y="140" width="40" height="10" fill="#ff4d00"/>

  <!-- Glowing Rim & Net -->
  <circle cx="660" cy="155" r="45" fill="url(#rimGlow)"/>
  <ellipse cx="660" cy="155" rx="35" ry="10" fill="none" stroke="#ff4d00" stroke-width="6"/>
  <!-- Basketball Net Mesh -->
  <path d="M 625 155 L 635 220 M 642 155 L 648 220 M 660 155 L 660 225 M 678 155 L 672 220 M 695 155 L 685 220" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 630 175 L 690 175 M 633 195 L 687 195 M 636 210 L 684 210" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Soaring Basketball Player Silhouette Dunking -->
  <g transform="translate(180, 20)">
    <!-- Shadow / Trail -->
    <path d="M 180 320 L 320 180 C 350 140, 420 120, 440 140" stroke="rgba(255, 77, 0, 0.3)" stroke-width="40" fill="none" stroke-linecap="round"/>

    <!-- Player Body in Mid-Air Extension -->
    <!-- Arms Slamming Ball down into Rim -->
    <path d="M 330 190 C 370 140, 410 110, 450 125" stroke="#ff4d00" stroke-width="32" stroke-linecap="round" fill="none"/>
    <path d="M 340 190 C 375 145, 415 115, 455 130" stroke="#ffffff" stroke-width="28" stroke-linecap="round" fill="none"/>

    <!-- Basketball at Rim Peak -->
    <circle cx="465" cy="120" r="32" fill="url(#ballDunk)" stroke="#050505" stroke-width="3"/>
    <path d="M 435 120 L 495 120 M 465 90 L 465 150" stroke="#050505" stroke-width="2.5"/>

    <!-- Head & Body -->
    <circle cx="345" cy="195" r="22" fill="#ff4d00"/>
    <!-- Jersey Torso -->
    <path d="M 320 210 L 260 300 L 200 370 L 260 380 L 310 290 Z" fill="#ff4d00"/>
    <text x="270" y="320" font-family="'Bebas Neue', sans-serif" font-size="45" font-weight="900" fill="#ffffff">04</text>

    <!-- Legs Spread in Mid-Air Flying Motion -->
    <path d="M 230 360 L 140 440 L 90 480" stroke="#ff4d00" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M 250 375 L 200 470 L 170 500" stroke="#ff4d00" stroke-width="26" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Title Banner overlay at bottom -->
  <rect x="0" y="420" width="800" height="80" fill="#050505" opacity="0.9"/>
  <text x="400" y="465" font-family="'Bebas Neue', sans-serif" font-size="38" font-weight="900" fill="#ff4d00" text-anchor="middle" letter-spacing="4">HIGH-FLYING POSTER SLAM DUNK ACTION</text>
</svg>
