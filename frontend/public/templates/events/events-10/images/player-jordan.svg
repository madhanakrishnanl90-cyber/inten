<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  <defs>
    <linearGradient id="bgJordan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a33"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="skinJordan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9c684b"/>
      <stop offset="100%" stop-color="#69412d"/>
    </linearGradient>
    <linearGradient id="jerseyTitans" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0044bb"/>
    </linearGradient>
    <radialGradient id="glowJordan" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0088ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0044bb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="650" fill="url(#bgJordan)"/>
  <circle cx="250" cy="220" r="220" fill="url(#glowJordan)"/>

  <!-- Body / Jersey -->
  <path d="M 115 350 L 210 280 L 290 280 L 385 350 L 355 650 L 145 650 Z" fill="url(#jerseyTitans)"/>
  <path d="M 210 280 Q 250 315 290 280" fill="none" stroke="#ffffff" stroke-width="8"/>
  <path d="M 115 350 L 145 500" stroke="#ffffff" stroke-width="6"/>
  <path d="M 385 350 L 355 500" stroke="#ffffff" stroke-width="6"/>

  <!-- Jersey Number 11 -->
  <text x="250" y="440" font-family="'Bebas Neue', sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">11</text>
  <text x="250" y="340" font-family="'Barlow Condensed', sans-serif" font-size="26" font-weight="800" fill="#ff7518" text-anchor="middle" letter-spacing="3">TITANS</text>

  <!-- Arms -->
  <path d="M 115 350 C 75 420, 85 510, 115 570" stroke="url(#skinJordan)" stroke-width="50" stroke-linecap="round" fill="none"/>
  <path d="M 385 350 C 425 420, 415 510, 385 570" stroke="url(#skinJordan)" stroke-width="50" stroke-linecap="round" fill="none"/>

  <!-- Neck & Face -->
  <rect x="228" y="240" width="44" height="55" rx="10" fill="url(#skinJordan)"/>
  <path d="M 195 175 C 195 105, 305 105, 305 175 C 305 245, 195 245, 195 175 Z" fill="url(#skinJordan)"/>

  <!-- Athletic Headband & Fade Hair Cut -->
  <path d="M 190 160 C 190 95, 310 95, 310 160 C 290 110, 210 110, 190 160 Z" fill="#111111"/>
  <!-- Orange Pro Headband -->
  <rect x="192" y="145" width="116" height="24" rx="6" fill="#ff4d00"/>
  <circle cx="250" cy="157" r="6" fill="#ffffff"/>

  <!-- Human Facial Details: Eyes, Brows, Nose, Lips -->
  <ellipse cx="225" cy="182" rx="8" ry="5" fill="#111"/>
  <ellipse cx="275" cy="182" rx="8" ry="5" fill="#111"/>
  <path d="M 212 173 Q 225 167 238 174" stroke="#111" stroke-width="4" fill="none"/>
  <path d="M 262 174 Q 275 167 288 173" stroke="#111" stroke-width="4" fill="none"/>
  <path d="M 250 182 L 246 202 L 254 202 Z" fill="#543323"/>
  <path d="M 235 218 Q 250 225 265 218" stroke="#402316" stroke-width="5" fill="none"/>

  <!-- Nameplate -->
  <rect x="0" y="570" width="500" height="80" fill="#050505" opacity="0.95"/>
  <text x="250" y="612" font-family="'Bebas Neue', sans-serif" font-size="36" font-weight="900" fill="#0088ff" text-anchor="middle" letter-spacing="3">JORDAN STERLING #11</text>
  <text x="250" y="638" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">SHOOTING GUARD — CITY TITANS</text>
</svg>
