<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  <defs>
    <linearGradient id="bgM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0a00"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Photorealistic Skin Gradients -->
    <radialGradient id="skinBaseM" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#8a5a44"/>
      <stop offset="60%" stop-color="#6b422e"/>
      <stop offset="100%" stop-color="#4a2b1c"/>
    </radialGradient>
    <linearGradient id="skinHighlightM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6735b"/>
      <stop offset="100%" stop-color="#6b422e"/>
    </linearGradient>
    <linearGradient id="lipGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#734937"/>
      <stop offset="100%" stop-color="#4a2b1c"/>
    </linearGradient>

    <radialGradient id="eyeGlowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#42291d"/>
      <stop offset="70%" stop-color="#1f120b"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>

    <linearGradient id="jerseyM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#b33600"/>
    </linearGradient>
  </defs>

  <rect width="500" height="650" fill="url(#bgM)"/>

  <!-- Arena Lighting Background Glow -->
  <circle cx="250" cy="200" r="240" fill="#ff4d00" opacity="0.15"/>
  <circle cx="250" cy="180" r="140" fill="#ffffff" opacity="0.05"/>

  <!-- Shoulders & Jersey -->
  <path d="M 90 380 L 195 295 L 305 295 L 410 380 L 370 650 L 130 650 Z" fill="url(#jerseyM)"/>
  <path d="M 195 295 Q 250 330 305 295" fill="none" stroke="#ffffff" stroke-width="8"/>
  <text x="250" y="445" font-family="'Bebas Neue', sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">04</text>
  <text x="250" y="345" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">WARRIORS</text>

  <!-- Neck -->
  <path d="M 215 250 L 215 310 Q 250 325 285 310 L 285 250 Z" fill="url(#skinHighlightM)"/>
  <path d="M 215 250 Q 250 280 285 250 L 285 275 Q 250 295 215 275 Z" fill="#4a2b1c" opacity="0.4"/>

  <!-- Human Head Base Oval -->
  <path d="M 170 185 C 170 100, 330 100, 330 185 C 330 260, 290 280, 250 280 C 210 280, 170 260, 170 185 Z" fill="url(#skinBaseM)"/>

  <!-- Facial Cheekbone Highlights -->
  <path d="M 180 180 C 190 140, 230 140, 250 145 C 270 140, 310 140, 320 180 C 310 220, 280 250, 250 255 C 220 250, 190 220, 180 180 Z" fill="url(#skinHighlightM)" opacity="0.6"/>

  <!-- Human Hair - Short Buzzcut Texture -->
  <path d="M 165 175 C 165 95, 335 95, 335 175 C 320 110, 180 110, 165 175 Z" fill="#120c09"/>
  <!-- Hairline -->
  <path d="M 175 165 Q 210 150 250 152 Q 290 150 325 165 Q 310 135 250 132 Q 190 135 175 165 Z" fill="#241711"/>

  <!-- Human Ears -->
  <path d="M 162 175 C 152 185, 155 215, 172 215 Z" fill="url(#skinBaseM)"/>
  <path d="M 338 175 C 348 185, 345 215, 328 215 Z" fill="url(#skinBaseM)"/>

  <!-- Human Eyebrows -->
  <path d="M 195 168 Q 220 158 238 166" stroke="#120c09" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M 262 166 Q 280 158 305 168" stroke="#120c09" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Realistic Human Eyes -->
  <!-- Left Eye -->
  <ellipse cx="218" cy="180" rx="14" ry="8" fill="#ffffff"/>
  <circle cx="218" cy="180" r="7" fill="url(#eyeGlowM)"/>
  <circle cx="218" cy="180" r="3" fill="#000000"/>
  <circle cx="220" cy="178" r="1.5" fill="#ffffff"/> <!-- catchlight -->
  <path d="M 203 178 Q 218 171 233 178" stroke="#241711" stroke-width="3" fill="none"/>

  <!-- Right Eye -->
  <ellipse cx="282" cy="180" rx="14" ry="8" fill="#ffffff"/>
  <circle cx="282" cy="180" r="7" fill="url(#eyeGlowM)"/>
  <circle cx="282" cy="180" r="3" fill="#000000"/>
  <circle cx="284" cy="178" r="1.5" fill="#ffffff"/> <!-- catchlight -->
  <path d="M 267 178 Q 282 171 297 178" stroke="#241711" stroke-width="3" fill="none"/>

  <!-- Human Nose -->
  <path d="M 245 170 L 242 208 Q 235 218 245 220 Q 255 220 258 208 L 255 170 Z" fill="none"/>
  <path d="M 242 212 C 235 214, 235 222, 245 222 C 255 222, 265 214, 258 212 Q 250 224 242 212 Z" fill="#4a2b1c"/>

  <!-- Human Lips -->
  <path d="M 225 238 Q 250 232 275 238 Q 250 244 225 238 Z" fill="url(#lipGradM)"/>
  <path d="M 228 238 Q 250 248 272 238 Q 250 252 228 238 Z" fill="#381e13"/>

  <!-- Nameplate -->
  <rect x="0" y="570" width="500" height="80" fill="#050505" opacity="0.95"/>
  <text x="250" y="612" font-family="'Bebas Neue', sans-serif" font-size="36" font-weight="900" fill="#ff4d00" text-anchor="middle" letter-spacing="3">MARCUS VANCE #04</text>
  <text x="250" y="638" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">POINT GUARD — VORTEXA WARRIORS</text>
</svg>
