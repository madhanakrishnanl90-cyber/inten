<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  <defs>
    <linearGradient id="bgDevraj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#331000"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="skinDevraj" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b07d5b"/>
      <stop offset="100%" stop-color="#7a5236"/>
    </linearGradient>
    <linearGradient id="jerseyDevraj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#cc3d00"/>
    </linearGradient>
    <radialGradient id="glowDevraj" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff7518" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="650" fill="url(#bgDevraj)"/>
  <circle cx="250" cy="220" r="220" fill="url(#glowDevraj)"/>

  <!-- Athletic Broad Shoulders -->
  <path d="M 100 350 L 200 280 L 300 280 L 400 350 L 360 650 L 140 650 Z" fill="url(#jerseyDevraj)"/>
  <path d="M 200 280 Q 250 315 300 280" fill="none" stroke="#ffffff" stroke-width="8"/>
  <path d="M 100 350 L 135 500" stroke="#ffffff" stroke-width="6"/>
  <path d="M 400 350 L 365 500" stroke="#ffffff" stroke-width="6"/>

  <!-- Jersey Number 23 -->
  <text x="250" y="440" font-family="'Bebas Neue', sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">23</text>
  <text x="250" y="340" font-family="'Barlow Condensed', sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">WARRIORS</text>

  <!-- Bicep Arms -->
  <path d="M 100 350 C 60 420, 70 520, 100 580" stroke="url(#skinDevraj)" stroke-width="54" stroke-linecap="round" fill="none"/>
  <path d="M 400 350 C 440 420, 430 520, 400 580" stroke="url(#skinDevraj)" stroke-width="54" stroke-linecap="round" fill="none"/>

  <!-- Neck & Strong Jaw Head -->
  <rect x="225" y="240" width="50" height="55" rx="10" fill="url(#skinDevraj)"/>
  <path d="M 190 175 C 190 105, 310 105, 310 175 C 310 245, 190 245, 190 175 Z" fill="url(#skinDevraj)"/>

  <!-- Dark Hair & Athletic Beard -->
  <path d="M 185 165 C 185 95, 315 95, 315 165 C 295 115, 205 115, 185 165 Z" fill="#151515"/>
  <!-- Beard & Mustache Structure -->
  <path d="M 200 200 C 200 245, 300 245, 300 200 C 290 250, 210 250, 200 200 Z" fill="#151515"/>
  <path d="M 230 205 Q 250 200 270 205" stroke="#151515" stroke-width="6" fill="none"/>

  <!-- Eyes & Eyebrows -->
  <ellipse cx="225" cy="175" rx="8" ry="5" fill="#111"/>
  <ellipse cx="275" cy="175" rx="8" ry="5" fill="#111"/>
  <path d="M 210 165 Q 225 158 238 167" stroke="#111" stroke-width="5" fill="none"/>
  <path d="M 262 167 Q 275 158 290 165" stroke="#111" stroke-width="5" fill="none"/>

  <!-- Nameplate -->
  <rect x="0" y="570" width="500" height="80" fill="#050505" opacity="0.95"/>
  <text x="250" y="612" font-family="'Bebas Neue', sans-serif" font-size="36" font-weight="900" fill="#ff4d00" text-anchor="middle" letter-spacing="3">DEVRAJ SINGH #23</text>
  <text x="250" y="638" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">POWER FORWARD — VORTEXA WARRIORS</text>
</svg>
