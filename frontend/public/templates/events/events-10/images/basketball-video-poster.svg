<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4d00" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#111111" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7518"/>
      <stop offset="100%" stop-color="#ff4d00"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- Basketball Texture & Lines -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="4" fill="none">
    <circle cx="960" cy="540" r="350"/>
    <path d="M 610 540 L 1310 540"/>
    <path d="M 960 190 L 960 890"/>
    <path d="M 750 250 Q 960 540 750 830"/>
    <path d="M 1170 250 Q 960 540 1170 830"/>
  </g>

  <!-- Dynamic Speed Lines -->
  <line x1="100" y1="200" x2="600" y2="900" stroke="#ff4d00" stroke-width="3" opacity="0.3"/>
  <line x1="1300" y1="100" x2="1800" y2="800" stroke="#ff7518" stroke-width="2" opacity="0.25"/>

  <!-- Center Glow Brand Emblem -->
  <text x="960" y="520" font-family="'Bebas Neue', 'Barlow Condensed', sans-serif" font-size="120" font-weight="900" fill="url(#orangeGrad)" text-anchor="middle" letter-spacing="6">THUNDERCOURT CLASH</text>
  <text x="960" y="600" font-family="'Barlow Condensed', sans-serif" font-size="40" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="8">INTERNATIONAL BASKETBALL TOURNAMENT — CHENNAI 2026</text>
</svg>
