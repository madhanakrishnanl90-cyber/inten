          }

            '</button>' +
            '<button id="btn-refresh" style="display: flex; align-items: center; justify-content: center; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; width: 34px; height: 34px; color: #475569; cursor: pointer; transition: all 0.15s; outline: none; box-shadow: 0 1px 2px rgba(0,0,0,0.03);">' +
            '  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>' +
            '</button>';
          topBar.appendChild(rightDiv);
          body.appendChild(topBar);
          
          // Canvas Area with clean white backdrop
          const canvas = document.createElement('main');
          canvas.style.cssText = 'flex: 1 !important; display: flex !important; align-items: center !important; justify-content: center !important; padding: 24px !important; overflow: auto !important; box-sizing: border-box !important; position: relative !important; background-color: transparent !important;';
          
          // Device Frame Container (Default Desktop)
          const frameContainer = document.createElement('div');
          frameContainer.id = 'device-frame';
          frameContainer.style.width = '100%';
          frameContainer.style.height = '100%';
          frameContainer.style.maxHeight = '100%';
          frameContainer.style.maxWidth = '100%';
          frameContainer.style.backgroundColor = 'transparent';
          frameContainer.style.border = 'none';
          frameContainer.style.borderRadius = '12px';
          frameContainer.style.boxShadow = '0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04)';
          frameContainer.style.position = 'relative';
          frameContainer.style.display = 'flex';
          frameContainer.style.flexDirection = 'column';
          frameContainer.style.overflow = 'hidden';
          frameContainer.style.boxSizing = 'border-box';
          frameContainer.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
          
          // Dynamic Island Notch (Hidden by default on Desktop)
          const notch = document.createElement('div');
          notch.id = 'phone-notch';
          notch.style.position = 'absolute';
          notch.style.top = '8px';
          notch.style.left = '50%';
          notch.style.transform = 'translateX(-50%)';
          notch.style.width = '96px';
          notch.style.height = '24px';
          notch.style.backgroundColor = '#0f172a';
          notch.style.borderRadius = '99px';
          notch.style.zIndex = '20';
          notch.style.display = 'none';
          notch.style.alignItems = 'center';
          notch.style.justifyContent = 'space-between';
          notch.style.padding = '0 10px';
          notch.style.boxSizing = 'border-box';
          notch.innerHTML = '<div style="width: 8px; height: 8px; border-radius: 50%; background-color: #1e293b;"></div><div style="width: 6px; height: 6px; border-radius: 50%; background-color: #090d16;"></div>';
          frameContainer.appendChild(notch);
          
          const iframe = document.createElement('iframe');
          iframe.id = 'preview-iframe';
          iframe.src = currentUrl.toString();
          iframe.style.width = '100%';
          iframe.style.height = '100%';
          iframe.style.border = 'none';
          iframe.style.borderRadius = '12px';
          iframe.style.background = '#ffffff';
          
          frameContainer.appendChild(iframe);
          canvas.appendChild(frameContainer);
          body.appendChild(canvas);
          
          // Interactivity
          const btnDesktop = body.querySelector('#view-desktop');
          const btnTablet = body.querySelector('#view-tablet');
          const btnMobile = body.querySelector('#view-mobile');
          const btnOrientation = body.querySelector('#toggle-orientation');
          const orientationText = body.querySelector('#orientation-text');
          const btnRefresh = body.querySelector('#btn-refresh');
          
          let activeMode = 'desktop';
          let orientation = 'portrait';
          
          function updateStyles() {
            [btnDesktop, btnTablet, btnMobile].forEach(btn => {
              btn.style.background = 'transparent';
              btn.style.color = '#64748b';
              btn.style.border = '1px solid transparent';
              btn.style.fontWeight = '500';
              btn.style.boxShadow = 'none';
            });
            
            if (activeMode === 'desktop') {
              btnDesktop.style.background = '#eff6ff';
              btnDesktop.style.color = '#2563eb';
              btnDesktop.style.border = '1px solid #bfdbfe';
              btnDesktop.style.fontWeight = '600';
              btnDesktop.style.boxShadow = '0 1px 2px rgba(37,99,235,0.08)';
              
              btnOrientation.style.display = 'none';
              notch.style.display = 'none';
              
              frameContainer.style.width = '100%';
              frameContainer.style.height = '100%';
              frameContainer.style.maxHeight = '100%';
              frameContainer.style.maxWidth = '100%';
              frameContainer.style.backgroundColor = 'transparent';
              frameContainer.style.border = 'none';
              frameContainer.style.borderRadius = '12px';
              frameContainer.style.boxShadow = '0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04)';
              
              iframe.style.borderRadius = '12px';
            } else if (activeMode === 'tablet') {
              btnTablet.style.background = '#eff6ff';
              btnTablet.style.color = '#2563eb';
              btnTablet.style.border = '1px solid #bfdbfe';
              btnTablet.style.fontWeight = '600';
              btnTablet.style.boxShadow = '0 1px 2px rgba(37,99,235,0.08)';
              
              btnOrientation.style.display = 'flex';
              notch.style.display = 'none';
              
              const isP = orientation === 'portrait';
              frameContainer.style.width = isP ? '768px' : '980px';
              frameContainer.style.height = isP ? '920px' : '680px';
              frameContainer.style.maxHeight = 'calc(100vh - 120px)';
              frameContainer.style.maxWidth = 'calc(100vw - 60px)';
              frameContainer.style.backgroundColor = '#0f172a';
              frameContainer.style.border = '14px solid #0f172a';
              frameContainer.style.borderRadius = '38px';
              frameContainer.style.boxShadow = '0 25px 50px -12px rgba(15, 23, 42, 0.35)';
              
              iframe.style.borderRadius = '24px';
            } else if (activeMode === 'mobile') {
              btnMobile.style.background = '#eff6ff';
              btnMobile.style.color = '#2563eb';
              btnMobile.style.border = '1px solid #bfdbfe';
              btnMobile.style.fontWeight = '600';
              btnMobile.style.boxShadow = '0 1px 2px rgba(37,99,235,0.08)';
              
              btnOrientation.style.display = 'flex';
              
              const isP = orientation === 'portrait';
              notch.style.display = isP ? 'flex' : 'none';
              
              frameContainer.style.width = isP ? '390px' : '780px';
              frameContainer.style.height = isP ? '800px' : '390px';
              frameContainer.style.maxHeight = 'calc(100vh - 110px)';
              frameContainer.style.maxWidth = 'calc(100vw - 40px)';
              frameContainer.style.backgroundColor = '#0f172a';
              frameContainer.style.border = '12px solid #0f172a';
              frameContainer.style.borderRadius = '48px';
              frameContainer.style.boxShadow = '0 25px 50px -12px rgba(15, 23, 42, 0.38)';
              
              iframe.style.borderRadius = '36px';
            }
          }
          
          btnDesktop.addEventListener('click', () => { activeMode = 'desktop'; updateStyles(); });
          btnTablet.addEventListener('click', () => { activeMode = 'tablet'; updateStyles(); });
          btnMobile.addEventListener('click', () => { activeMode = 'mobile'; updateStyles(); });
          
          btnOrientation.addEventListener('click', () => {
            orientation = orientation === 'portrait' ? 'landscape' : 'portrait';
            orientationText.innerText = orientation === 'portrait' ? 'Portrait' : 'Landscape';
            updateStyles();
          });
          
          btnRefresh.addEventListener('click', () => {
            iframe.src = currentUrl.toString();
          });
          
          document.documentElement.style.visibility = 'visible';
        });
      } else {
        document.documentElement.style.visibility = 'visible';
      }
    })();
  </script>
    <div id="root"></div>
  </body>
</html>
