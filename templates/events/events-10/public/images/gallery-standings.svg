<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgStandings" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a00"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#ff7518"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgStandings)"/>

  <!-- Speed Lines -->
  <line x1="0" y1="100" x2="800" y2="400" stroke="#ff4d00" stroke-width="2" opacity="0.2"/>

  <!-- Standings Board Container -->
  <rect x="50" y="40" width="700" height="420" rx="10" fill="#0d0d0d" stroke="#ff4d00" stroke-width="2"/>
  
  <!-- Board Header -->
  <rect x="50" y="40" width="700" height="70" rx="10" fill="url(#orangeBar)"/>
  <text x="400" y="86" font-family="'Bebas Neue', sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">THUNDERCOURT CLASH — GROUP STANDINGS</text>

  <!-- Table Rows -->
  <!-- Header Row -->
  <rect x="70" y="130" width="660" height="35" fill="#1b1b1b"/>
  <text x="100" y="153" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" fill="#ff4d00">POS</text>
  <text x="220" y="153" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" fill="#ffffff">TEAM FRANCHISE</text>
  <text x="460" y="153" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" fill="#ffffff">WINS</text>
  <text x="540" y="153" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" fill="#ffffff">LOSSES</text>
  <text x="640" y="153" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" fill="#ff4d00">PTS</text>

  <!-- Row 1 -->
  <rect x="70" y="180" width="660" height="50" fill="rgba(255, 77, 0, 0.15)" stroke="#ff4d00" stroke-width="1"/>
  <text x="100" y="213" font-family="'Bebas Neue', sans-serif" font-size="28" font-weight="900" fill="#ffd700">01 🏆</text>
  <text x="220" y="213" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#ffffff">VORTEXA WARRIORS</text>
  <text x="475" y="213" font-family="'Bebas Neue', sans-serif" font-size="26" fill="#00c853">4</text>
  <text x="560" y="213" font-family="'Bebas Neue', sans-serif" font-size="26" fill="#ff1744">0</text>
  <text x="650" y="213" font-family="'Bebas Neue', sans-serif" font-size="30" font-weight="900" fill="#ff4d00">8</text>

  <!-- Row 2 -->
  <rect x="70" y="240" width="660" height="50" fill="#141414"/>
  <text x="100" y="273" font-family="'Bebas Neue', sans-serif" font-size="28" font-weight="900" fill="#ff7518">02</text>
  <text x="220" y="273" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#ffffff">CITY TITANS</text>
  <text x="475" y="273" font-family="'Bebas Neue', sans-serif" font-size="26" fill="#00c853">3</text>
  <text x="560" y="273" font-family="'Bebas Neue', sans-serif" font-size="26" fill="#ff1744">1</text>
  <text x="650" y="273" font-family="'Bebas Neue', sans-serif" font-size="30" font-weight="900" fill="#ff4d00">7</text>

  <!-- Row 3 -->
  <rect x="70" y="300" width="660" height="50" fill="#141414"/>
  <text x="100" y="333" font-family="'Bebas Neue', sans-serif" font-size="28" font-weight="900" fill="#ffffff">03</text>
  <text x="220" y="333" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#ffffff">METRO FALCONS</text>
  <text x="475" y="333" font-family="'Bebas Neue', sans-serif" font-size="26" fill="#00c853">2</text>
  <text x="560" y="333" font-family="'Bebas Neue', sans-serif" font-size="26" fill="#ff1744">2</text>
  <text x="650" y="333" font-family="'Bebas Neue', sans-serif" font-size="30" font-weight="900" fill="#ff4d00">6</text>

  <!-- Row 4 -->
  <rect x="70" y="360" width="660" height="50" fill="#141414"/>
  <text x="100" y="393" font-family="'Bebas Neue', sans-serif" font-size="28" font-weight="900" fill="#999999">04</text>
  <text x="220" y="393" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="800" fill="#ffffff">COASTAL KINGS</text>
  <text x="475" y="393" font-family="'Bebas Neue', sans-serif" font-size="26" fill="#00c853">1</text>
  <text x="560" y="393" font-family="'Bebas Neue', sans-serif" font-size="26" fill="#ff1744">3</text>
  <text x="650" y="393" font-family="'Bebas Neue', sans-serif" font-size="30" font-weight="900" fill="#ff4d00">5</text>
</svg>
