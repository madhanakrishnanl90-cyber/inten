<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0800"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="skinMarcus" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8d5b4c"/>
      <stop offset="100%" stop-color="#5c382e"/>
    </linearGradient>
    <linearGradient id="jerseyWarriors" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#b33600"/>
    </linearGradient>
    <radialGradient id="glowMarcus" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff4d00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="500" height="650" fill="url(#bg1)"/>
  <circle cx="250" cy="220" r="220" fill="url(#glowMarcus)"/>

  <!-- Speed lines background -->
  <line x1="30" y1="80" x2="470" y2="520" stroke="#ff4d00" stroke-width="2" opacity="0.25"/>

  <!-- Body / Shoulders -->
  <path d="M 120 360 L 210 290 L 290 290 L 380 360 L 350 650 L 150 650 Z" fill="url(#jerseyWarriors)"/>
  <path d="M 210 290 Q 250 320 290 290" fill="none" stroke="#ffffff" stroke-width="8"/>
  <path d="M 120 360 L 150 500" stroke="#ffffff" stroke-width="6"/>
  <path d="M 380 360 L 350 500" stroke="#ffffff" stroke-width="6"/>

  <!-- Jersey Number 04 -->
  <text x="250" y="440" font-family="'Bebas Neue', sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">04</text>
  <text x="250" y="340" font-family="'Barlow Condensed', sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">WARRIORS</text>

  <!-- Arms -->
  <path d="M 120 360 C 80 430, 90 520, 120 580" stroke="url(#skinMarcus)" stroke-width="50" stroke-linecap="round" fill="none"/>
  <path d="M 380 360 C 420 430, 410 520, 380 580" stroke="url(#skinMarcus)" stroke-width="50" stroke-linecap="round" fill="none"/>

  <!-- Neck & Face -->
  <rect x="228" y="245" width="44" height="55" rx="10" fill="url(#skinMarcus)"/>
  <!-- Head Oval -->
  <path d="M 195 180 C 195 110, 305 110, 305 180 C 305 245, 195 245, 195 180 Z" fill="url(#skinMarcus)"/>

  <!-- Short Athletic Hair Cut -->
  <path d="M 190 170 C 190 105, 310 105, 310 170 C 290 120, 210 120, 190 170 Z" fill="#0d0d0d"/>

  <!-- Ears -->
  <circle cx="192" cy="185" r="12" fill="url(#skinMarcus)"/>
  <circle cx="308" cy="185" r="12" fill="url(#skinMarcus)"/>

  <!-- Facial Features: Eyes, Nose, Lips -->
  <ellipse cx="225" cy="180" rx="8" ry="5" fill="#111"/>
  <ellipse cx="275" cy="180" rx="8" ry="5" fill="#111"/>
  <!-- Focused Brows -->
  <path d="M 210 170 Q 225 162 238 172" stroke="#111" stroke-width="4" fill="none"/>
  <path d="M 262 172 Q 275 162 290 170" stroke="#111" stroke-width="4" fill="none"/>
  <!-- Nose & Lips -->
  <path d="M 250 180 L 246 200 L 254 200 Z" fill="#5c382e"/>
  <path d="M 235 215 Q 250 222 265 215" stroke="#42251d" stroke-width="4" fill="none"/>

  <!-- Bottom Nameplate -->
  <rect x="0" y="570" width="500" height="80" fill="#050505" opacity="0.95"/>
  <text x="250" y="612" font-family="'Bebas Neue', sans-serif" font-size="36" font-weight="900" fill="#ff4d00" text-anchor="middle" letter-spacing="3">MARCUS VANCE #04</text>
  <text x="250" y="638" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">POINT GUARD — VORTEXA WARRIORS</text>
</svg>
