<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1500"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#cc9900"/>
    </linearGradient>
    <radialGradient id="trophyGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgTrophy)"/>
  <circle cx="400" cy="220" r="220" fill="url(#trophyGlow)"/>

  <!-- Golden Trophy Base -->
  <rect x="300" y="380" width="200" height="40" rx="6" fill="#1a1a1a" stroke="#ffd700" stroke-width="2"/>
  <rect x="330" y="340" width="140" height="40" rx="4" fill="url(#goldGrad)"/>

  <!-- Trophy Stem -->
  <path d="M 370 240 L 380 340 L 420 340 L 430 240 Z" fill="url(#goldGrad)"/>

  <!-- Golden Cup -->
  <path d="M 280 100 Q 400 130 520 100 L 480 250 Q 400 320 320 250 Z" fill="url(#goldGrad)"/>
  <!-- Cup Handles -->
  <path d="M 290 120 C 200 140, 220 230, 330 230" stroke="url(#goldGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>
  <path d="M 510 120 C 600 140, 580 230, 470 230" stroke="url(#goldGrad)" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- Basketball at Top of Trophy -->
  <circle cx="400" cy="90" r="45" fill="#ff4d00" stroke="#050505" stroke-width="4"/>
  <line x1="355" y1="90" x2="445" y2="90" stroke="#050505" stroke-width="3"/>
  <line x1="400" y1="45" x2="400" y2="135" stroke="#050505" stroke-width="3"/>

  <!-- Trophy Text -->
  <text x="400" y="450" font-family="'Bebas Neue', sans-serif" font-size="38" font-weight="900" fill="#ffd700" text-anchor="middle" letter-spacing="4">THUNDERCOURT CLASH CHAMPIONSHIP CUP</text>
</svg>
