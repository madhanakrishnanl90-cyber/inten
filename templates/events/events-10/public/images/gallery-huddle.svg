<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgHuddle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a33"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgHuddle)"/>

  <!-- Tactical Basketball Play Board Container -->
  <rect x="80" y="40" width="640" height="380" rx="10" fill="#0c1824" stroke="#0088ff" stroke-width="3"/>

  <!-- Court Markings on Board -->
  <rect x="120" y="80" width="560" height="300" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <circle cx="400" cy="230" r="50" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
  <line x1="400" y1="80" x2="400" y2="380" stroke="#ffffff" stroke-width="3" opacity="0.8"/>

  <!-- Key Area / Paint -->
  <rect x="120" y="150" width="120" height="160" fill="rgba(0, 136, 255, 0.2)" stroke="#ffffff" stroke-width="3"/>
  <path d="M 240 170 A 60 60 0 0 1 240 290" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Tactical Play X's and O's with Arrows -->
  <!-- Offense Guards -->
  <text x="280" y="150" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="900" fill="#ff4d00">O1</text>
  <text x="360" y="110" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="900" fill="#ff4d00">O2</text>
  <text x="320" y="320" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="900" fill="#ff4d00">O3</text>

  <!-- Pass & Pick Routes -->
  <path d="M 300 140 Q 340 180 340 240" stroke="#ff4d00" stroke-width="4" stroke-dasharray="8 6" fill="none"/>
  <polygon points="340,240 330,225 350,225" fill="#ff4d00"/>

  <path d="M 380 110 Q 480 160 500 240" stroke="#00e5ff" stroke-width="4" stroke-dasharray="8 6" fill="none"/>
  <polygon points="500,240 490,225 510,225" fill="#00e5ff"/>

  <!-- Defense X's -->
  <text x="250" y="180" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="900" fill="#ffffff">X1</text>
  <text x="340" y="160" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="900" fill="#ffffff">X2</text>
  <text x="290" y="280" font-family="'Bebas Neue', sans-serif" font-size="32" font-weight="900" fill="#ffffff">X3</text>

  <!-- Title Banner -->
  <rect x="0" y="420" width="800" height="80" fill="#050505" opacity="0.95"/>
  <text x="400" y="465" font-family="'Bebas Neue', sans-serif" font-size="38" font-weight="900" fill="#0088ff" text-anchor="middle" letter-spacing="4">TEAM HUDDLE & STRATEGIC PLAYBOOK</text>
</svg>
