<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="500" height="650">
  <defs>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b1200"/>
      <stop offset="50%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>

    <!-- Photorealistic Skin Gradients -->
    <radialGradient id="skinBaseDev" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ab7a5b"/>
      <stop offset="60%" stop-color="#8a5c40"/>
      <stop offset="100%" stop-color="#5c3c26"/>
    </radialGradient>
    <linearGradient id="skinHighlightDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c49170"/>
      <stop offset="100%" stop-color="#8a5c40"/>
    </linearGradient>

    <linearGradient id="jerseyDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#cc3d00"/>
    </linearGradient>
  </defs>

  <rect width="500" height="650" fill="url(#bgDev)"/>
  <circle cx="250" cy="200" r="240" fill="#ff7518" opacity="0.15"/>

  <!-- Broad Shoulders & Jersey -->
  <path d="M 80 370 L 190 290 L 310 290 L 420 370 L 380 650 L 120 650 Z" fill="url(#jerseyDev)"/>
  <path d="M 190 290 Q 250 325 310 290" fill="none" stroke="#ffffff" stroke-width="8"/>
  <text x="250" y="445" font-family="'Bebas Neue', sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">23</text>
  <text x="250" y="345" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">WARRIORS</text>

  <!-- Neck -->
  <path d="M 215 245 L 215 305 Q 250 320 285 305 L 285 245 Z" fill="url(#skinHighlightDev)"/>
  <path d="M 215 245 Q 250 275 285 245 L 285 270 Q 250 290 215 270 Z" fill="#5c3c26" opacity="0.4"/>

  <!-- Human Head Base Oval -->
  <path d="M 165 180 C 165 95, 335 95, 335 180 C 335 255, 295 275, 250 275 C 205 275, 165 255, 165 180 Z" fill="url(#skinBaseDev)"/>

  <!-- Facial Cheekbone Highlights -->
  <path d="M 175 175 C 185 135, 225 135, 250 140 C 275 135, 315 135, 325 175 C 315 215, 285 245, 250 250 C 215 245, 185 215, 175 175 Z" fill="url(#skinHighlightDev)" opacity="0.6"/>

  <!-- Short Dark Hair & Trimmed Beard -->
  <path d="M 160 170 C 160 90, 340 90, 340 170 C 325 105, 175 105, 160 170 Z" fill="#120c09"/>
  <!-- Full Athletic Beard & Mustache -->
  <path d="M 175 195 C 175 270, 325 270, 325 195 C 315 260, 185 260, 175 195 Z" fill="#120c09"/>
  <path d="M 210 205 Q 250 195 290 205 Q 250 212 210 205 Z" fill="#120c09"/>

  <!-- Human Ears -->
  <path d="M 158 170 C 148 180, 151 210, 168 210 Z" fill="url(#skinBaseDev)"/>
  <path d="M 342 170 C 352 180, 349 210, 332 210 Z" fill="url(#skinBaseDev)"/>

  <!-- Human Eyebrows -->
  <path d="M 190 162 Q 215 152 235 160" stroke="#120c09" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 265 160 Q 285 152 310 162" stroke="#120c09" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Realistic Human Eyes -->
  <ellipse cx="215" cy="174" rx="14" ry="8" fill="#ffffff"/>
  <circle cx="215" cy="174" r="7" fill="#362215"/>
  <circle cx="215" cy="174" r="3" fill="#000000"/>
  <circle cx="217" cy="172" r="1.5" fill="#ffffff"/>

  <ellipse cx="285" cy="174" rx="14" ry="8" fill="#ffffff"/>
  <circle cx="285" cy="174" r="7" fill="#362215"/>
  <circle cx="285" cy="174" r="3" fill="#000000"/>
  <circle cx="287" cy="172" r="1.5" fill="#ffffff"/>

  <!-- Human Nose -->
  <path d="M 242 206 C 235 208, 235 216, 245 216 C 255 216, 265 208, 258 206 Q 250 218 242 206 Z" fill="#5c3c26"/>

  <!-- Nameplate -->
  <rect x="0" y="570" width="500" height="80" fill="#050505" opacity="0.95"/>
  <text x="250" y="612" font-family="'Bebas Neue', sans-serif" font-size="36" font-weight="900" fill="#ff4d00" text-anchor="middle" letter-spacing="3">DEVRAJ SINGH #23</text>
  <text x="250" y="638" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">POWER FORWARD — VORTEXA WARRIORS</text>
