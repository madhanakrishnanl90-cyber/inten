<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7518"/>
      <stop offset="60%" stop-color="#ff4d00"/>
      <stop offset="100%" stop-color="#cc3d00"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff4d00" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Basketball Circle -->
  <circle cx="50" cy="50" r="44" fill="url(#ballGrad)" stroke="#111111" stroke-width="4" filter="url(#glow)"/>

  <!-- Basketball Ribs / Seams -->
  <g stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round">
    <!-- Horizontal & Vertical Lines -->
    <line x1="6" y1="50" x2="94" y2="50"/>
    <line x1="50" y1="6" x2="50" y2="94"/>
    
    <!-- Curved Side Ribs -->
    <path d="M 20 16 C 42 35, 42 65, 20 84"/>
    <path d="M 80 16 C 58 35, 58 65, 80 84"/>
  </g>
</svg>