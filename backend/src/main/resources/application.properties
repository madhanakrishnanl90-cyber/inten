# ===================================================================
# Spring Boot Configuration for Website Template Marketplace
# ===================================================================

server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:website_template_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a036c4d8e2f1a7b9c3d5e8f0a2b4c6d8e1f3a5b7c9d0e2f4a6b}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.technosprint.marketplace=INFO
